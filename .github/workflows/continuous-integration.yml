name: Continuous Integration

permissions:
  contents: read

on:
  repository_dispatch:
    types:
      - Upstream Sync
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Type Check and Lint
        run: pnpm -r typecheck && pnpm run lint

      - name: Check God-Files
        run: node scripts/check-god-files.mjs

      # The last two steps of `pnpm run checks`, run here because each is a check that
      # fails on a merge rather than on a developer's machine.
      #
      # **`validate:locales` compares every `t()` call site against the bundle**, which is
      # the check that catches a key added to a component and forgotten everywhere else. It
      # is not a no-op: with one shipped language the bundle-to-bundle comparison is skipped
      # entirely, so before it read the call sites it reported `ALL OK` while
      # `libraries.scanPausedRequests` was used and absent.
      - name: Validate Locales
        run: pnpm run validate:locales

      # `verify-spa-shell` rejects a missing, stubbed or mismatched SPA shell, and the
      # Worker serves the shell from the **last local build** — so a stale artifact is a
      # deploy that serves yesterday's UI.
      #
      # The build is a **precondition**, not a convenience. Both `apps/web/dist/` and
      # `apps/api/src/generated/` are gitignored, so a fresh checkout has neither, and
      # `postinstall` runs `ensure-spa-shell-stub.mjs`, which writes a deliberately **empty**
      # stub so `tsc` can resolve `SPA_HTML` before anyone has built. Verifying without
      # building therefore cannot pass — it failed on the first run of this step, with
      # precisely the message the check is designed to give.
      #
      # That ordering is the thing worth stating: a check whose subject is a generated
      # artifact has to be preceded by the generation, or CI fails on a correct commit for
      # the wrong reason. A developer running `pnpm run checks` locally has usually built
      # already, which is why the mistake survived being written and reviewed.
      - name: Build Web App
        run: pnpm --filter @edge-sonic/web build

      - name: Verify The SPA Shell
        run: node scripts/verify-spa-shell.mjs

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Tests with Coverage
        run: pnpm run test:coverage

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Integration Tests
        run: pnpm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build Web App
        run: pnpm --filter @edge-sonic/web build

  dependabot-auto-merge:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.state == 'open' && !github.event.repository.fork }}
    name: Auto-Merge Dependabot PR
    needs:
      - checks
      - unit-tests
      - integration-tests
      - build
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Enable Auto-Merge
        uses: ./.github/actions/retry-step
        with:
          command: gh pr merge --auto --merge "$PR_URL"
          max_attempts: '5'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  dispatch-upstream-sync-deployment:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'Upstream Sync' }}
    name: Dispatch Upstream Sync Deployment
    needs:
      - checks
      - unit-tests
      - integration-tests
      - build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dispatch Deployment
        uses: ./.github/actions/retry-step
        with:
          command: >
            printf '{"event_type":"Upstream Sync Deployment","client_payload":{"branch":"%s","sha":"%s"}}\n'
            "$PAYLOAD_BRANCH" "$PAYLOAD_SHA"
            | gh api repos/${{ github.repository }}/dispatches --method POST --input -
          max_attempts: '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch || 'main' }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha || github.sha }}
