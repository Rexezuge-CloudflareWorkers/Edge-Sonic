name: Upstream Sync

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.repository.fork }}
    name: Sync From Upstream
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Sync Changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: Rexezuge-CloudflareWorkers/Edge-Sonic
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      # `Upstream Sync Integration` rather than `Upstream Sync`, so it cannot be
      # confused with the `Upstream Sync Deployment` event the deploy workflow listens
      # for. Both this producer and continuous-integration.yml are the only two sides of
      # this contract, and they change in the same commit.
      - name: Trigger Continuous Integration
        if: steps.sync.outputs.has_new_commits == 'true'
        uses: ./.github/actions/retry-step
        with:
          command: gh api repos/${{ github.repository }}/dispatches --method POST -f event_type='Upstream Sync Integration'
          max_attempts: '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
