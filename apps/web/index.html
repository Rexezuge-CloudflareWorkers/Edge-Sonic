<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edge-Sonic</title>
    <!--
      The favicon is inlined as a data URI so there is exactly one copy of it:
      a path-based icon would 404 on a host with no assets binding, and a second
      file in `public/` would drift out of sync with this one. Edit it and re-run
      `pnpm run build`, or the worker keeps serving the previous bundle.

      The mark is a vinyl disc, which is what `AppHeader` already renders — so the
      tab and the product agree on one symbol. It is deliberately NOT a verbatim
      copy of lucide's `Disc3`: that icon carries two arc highlights at
      stroke-width 2 in a 24 box, which is 0.67px once the tab renders it at 16,
      so they arrive as grey mush. This is the silhouette — ring, groove, spindle
      — redrawn above the legibility floor, at 1.5px / 1px / 2.5px respectively.
      The header keeps `Disc3`; the difference is a size budget, not drift.

      Colours are `globals.css` tokens: --color-surface-base, --color-accent and
      --color-accent-dim. Nothing asserts that, so a palette change can leave this
      stale.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23100f0d%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2210%22%20fill%3D%22none%22%20stroke%3D%22%236ee7b7%22%20stroke-width%3D%223%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%225.5%22%20fill%3D%22none%22%20stroke%3D%22%234fd1a0%22%20stroke-width%3D%222%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%222.5%22%20fill%3D%22%236ee7b7%22%2F%3E%3C%2Fsvg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
